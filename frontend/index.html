<!DOCTYPE html>
<!-- dir="rtl" et lang="ar" correspondent à l'état INITIAL : avant tout choix,
     l'application s'affiche en arabe. app.js ajuste ensuite selon la langue
     mémorisée. Le HTML est donc complet et lisible même sans JavaScript. -->
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover : indispensable pour atteindre les zones sûres
         (encoche, barre gestuelle) depuis le CSS. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="color-scheme" content="light">
    <!-- Teinte la barre du navigateur mobile, qui prolonge l'en-tête vert. -->
    <meta name="theme-color" content="#0e3b2e">

    <title>مساعد البحث في المستندات</title>

    <!-- DEUX voix typographiques, et c'est volontaire :
           - IBM Plex Sans Arabic : la parole de l'outil ;
           - Noto Naskh Arabic    : la parole CITÉE (la police du manuscrit).
         font-display: swap -> le texte s'affiche tout de suite dans la police de
         repli, puis se substitue. Jamais de texte invisible pendant le chargement. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;family=Noto+Naskh+Arabic:wght@400;600&amp;display=swap">

    <!-- Feuille COMPILÉE (npm run build:css).
         Aucun CDN, aucun compilateur dans le navigateur, aucune dépendance
         réseau : la page s'affiche même hors ligne. -->
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="shell">

        <!-- ================= En-tête ================= -->
        <header class="masthead">
            <div class="masthead__row">
                <div>
                    <h1 id="app-title" class="masthead__title">مساعد البحث في المستندات</h1>
                    <p id="app-subtitle" class="masthead__subtitle">الإجابة مع الاستشهاد بالمصدر: الملف والصفحة والأسطر</p>
                </div>

                <div class="masthead__actions">
                    <button id="lang-back-btn" type="button" class="icon-btn hidden"
                            title="تغيير اللغة" aria-label="تغيير اللغة">
                        <svg viewBox="0 0 16 16" width="16" height="16" fill="none"
                             stroke="currentColor" stroke-width="1.2" aria-hidden="true"
                             focusable="false">
                            <circle cx="8" cy="8" r="6.25"/>
                            <path d="M1.75 8h12.5"/>
                            <path d="M8 1.75c1.9 2 2.9 4.1 2.9 6.25S9.9 12.25 8 14.25C6.1 12.25 5.1 10.15 5.1 8S6.1 3.75 8 1.75Z"/>
                        </svg>
                    </button>

                    <div id="user-bar" class="user-chip hidden">
                        <span id="user-name" class="user-chip__name"></span>
                        <button id="logout-btn" type="button" class="btn btn--quiet">خروج</button>
                    </div>
                </div>
            </div>

            <!-- LE SEUL ornement de toute l'interface : un bandeau géométrique à
                 huit branches. Un carré, et le même pivoté de 45°. Géométrique et
                 non floral : c'est ce qui le garde austère au lieu de décoratif. -->
            <svg class="ornament" width="100%" height="10" aria-hidden="true" focusable="false">
                <defs>
                    <pattern id="girih" width="16" height="10" patternUnits="userSpaceOnUse">
                        <g fill="none" stroke="currentColor" stroke-width="0.7">
                            <rect x="5" y="2" width="6" height="6"/>
                            <rect x="5" y="2" width="6" height="6" transform="rotate(45 8 5)"/>
                        </g>
                    </pattern>
                </defs>
                <rect width="100%" height="10" fill="url(#girih)"/>
            </svg>
        </header>

        <!-- ================= Choix de la langue ================= -->
        <!-- Volontairement masqué ici : app.js l'affiche uniquement si aucune
             langue n'est mémorisée. Cela évite le bref affichage de cet écran
             pour un utilisateur déjà connecté. -->
        <main id="lang-panel" class="stage hidden">
            <div class="stage__panel card">
                <h2 class="card__title">اختر لغتك / Choisissez votre langue</h2>
                <div class="lang-grid">
                    <button id="lang-ar" type="button" class="lang-btn lang-btn--active">العربية</button>
                    <button id="lang-fr" type="button" class="lang-btn">Français</button>
                </div>
            </div>
        </main>

        <!-- ================= Connexion ================= -->
        <main id="auth-panel" class="stage hidden">
            <div class="stage__panel card">
                <h2 id="login-title" class="card__title">تسجيل الدخول</h2>

                <form id="auth-form" class="stack">
                    <input type="text" id="auth-username" class="field"
                           placeholder="اسم المستخدم" autocomplete="username"
                           aria-label="اسم المستخدم" required>

                    <input type="password" id="auth-password" class="field"
                           placeholder="كلمة المرور" autocomplete="current-password"
                           aria-label="كلمة المرور" required>

                    <p id="auth-error" class="error hidden" role="alert"></p>

                    <button type="submit" id="login-btn" class="btn btn--primary btn--block">
                        تسجيل الدخول
                    </button>
                    <button type="button" id="register-btn" class="btn btn--outline btn--block">
                        إنشاء حساب
                    </button>
                </form>
            </div>
        </main>

        <!-- ================= Conversation =================
             role="log" + aria-live : les nouvelles réponses sont annoncées aux
             lecteurs d'écran sans voler le focus. -->
        <main id="chat-window" class="thread hidden"
              role="log" aria-live="polite" aria-label="المحادثة"></main>

        <!-- ================= Zone de saisie ================= -->
        <footer id="composer" class="composer hidden">
            <form id="chat-form" class="composer__row">
                <input type="text" id="user-input" class="field composer__field"
                       placeholder="اكتب سؤالك…" aria-label="سؤالك"
                       autocomplete="off" required>
                <button type="submit" id="send-btn" class="btn btn--primary">إرسال</button>
            </form>
        </footer>

        <!-- Aucun écran ne s'affiche sans JavaScript : on le dit clairement
             plutôt que de laisser une page vide. -->
        <noscript>
            <div class="stage">
                <div class="stage__panel card">
                    <h2 class="card__title">JavaScript est nécessaire</h2>
                    <p class="citation__refs">
                        Cette application a besoin de JavaScript pour fonctionner.<br>
                        يحتاج هذا التطبيق إلى JavaScript ليعمل.
                    </p>
                </div>
            </div>
        </noscript>

    </div>

    <script src="app.js" defer></script>
</body>
</html>
