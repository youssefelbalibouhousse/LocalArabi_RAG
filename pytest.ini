[pytest]
# "pythonpath" rend importables le projet (app/) et le dossier scripts/
# sans avoir à bricoler sys.path dans chaque fichier de test.
pythonpath = . scripts

# Pytest ne cherchera les tests que dans ce dossier.
testpaths = tests

# Options par défaut : -v (verbeux) pour voir chaque test passer.
addopts = -v
