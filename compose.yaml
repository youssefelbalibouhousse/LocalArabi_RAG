# Docker Compose : version 100 % conteneurisée (API + Ollama).
#
# Lancement :  docker compose up --build
# Arrêt :      docker compose down
#
# Au premier lancement, le service "ollama-pull" télécharge les modèles
# bge-m3 et llama3.1 dans le volume "ollama" (plusieurs Go, une seule fois).

services:
  # --- Serveur de modèles Ollama --------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    ports:
      # 11435 côté hôte pour éviter le conflit avec un Ollama natif éventuel
      # (le conteneur API, lui, passe par le réseau interne, pas par ce port).
      - "11435:11434"

  # --- Conteneur jetable : télécharge les modèles (une seule fois) -------
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ollama:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    # Réessaie automatiquement en cas de coupure réseau (le téléchargement
    # reprend là où il s'était arrêté).
    command:
      - |
        until ollama pull bge-m3; do echo '⚠️ bge-m3: nouvel essai dans 10 s...'; sleep 10; done
        until ollama pull llama3.1; do echo '⚠️ llama3.1: nouvel essai dans 10 s...'; sleep 10; done
        echo '✅ Modèles téléchargés.'
    restart: "no"

  # --- API FastAPI -------------------------------------------------------
  api:
    build: .
    restart: unless-stopped
    environment:
      # Par défaut : le conteneur Ollama du même réseau Docker.
      # Surchargeable pour viser un Ollama distant (VM GPU louée) :
      #   OLLAMA_URL=http://mon-gpu.example.com:11434
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      # Fournisseur de génération : "ollama" ou "openai" (API compatible OpenAI).
      - LLM_PROVIDER=${LLM_PROVIDER:-ollama}
      - LLM_MODEL=${LLM_MODEL:-llama3.1}
      - LLM_BASE_URL=${LLM_BASE_URL:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      # Valeurs de développement par défaut ; surchargées en production via .env :
      #   SECRET_KEY=<clé générée>  et  ENVIRONMENT=production
      - SECRET_KEY=${SECRET_KEY:-dev-only-secret-key-change-me-in-production}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Niveau de journalisation (DEBUG pour diagnostiquer un incident).
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # Vide => logique par défaut : ouverte en dev, fermée en production.
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-}
      - CORS_ALLOW_ORIGINS=*
    volumes:
      # On monte les dossiers locaux pour que la base vectorielle et les
      # comptes/PDF soient persistants.
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - ollama

# Volumes nommés (gérés par Docker, pas de chemin à connaître)
volumes:
  ollama:
